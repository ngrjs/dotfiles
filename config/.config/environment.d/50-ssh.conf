# systemd ssh-agent.socket; set here so GUI apps (KeePassXC) see it, not just zsh.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
# ssh-agent runs this to confirm each use of a key added with confirmation
# (KeePassXC "Require user confirmation when this key is used").
SSH_ASKPASS=/usr/bin/lxqt-openssh-askpass
